name: Refresh asset catalog

# Regenerates AssetsPerExchange.json from the TradingView scanner and commits it
# back to the repo. GitHub Pages redeploys automatically on the resulting push.

on:
  schedule:
    # Daily at 06:17 UTC. Off-the-hour to reduce GitHub's scheduled-run delay.
    - cron: '17 6 * * *'
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

# Never run two refreshes at once.
concurrency:
  group: refresh-catalog
  cancel-in-progress: false

permissions:
  contents: write   # needed for GITHUB_TOKEN to push the updated catalog

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Regenerate catalog
        run: python3 AssetsPerExchange.py

      - name: Commit if the catalog changed
        run: |
          if git diff --quiet -- AssetsPerExchange.json; then
            echo "No change in AssetsPerExchange.json — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AssetsPerExchange.json
          git commit -m "chore: refresh asset catalog ($(date -u +%Y-%m-%d))"
          git push
